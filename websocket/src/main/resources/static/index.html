<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><title>Avaliações</title></head>
<body>
<h2>Avaliações (WebSocket)</h2>
<input id="nome" placeholder="Nome">
<input id="estrelas" type="number" min="0" max="5" value="5">
<input id="comentario" placeholder="Comentário (até 1000)" maxlength="1000">
<button id="enviar">Avaliar</button>
<ul id="lista"></ul>

<script>
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    const socket = new WebSocket(`${proto}//${location.host}/ws/avaliacoes`);
    const lista = document.getElementById("lista");

    const mostrar = a => {
      const li = document.createElement("li");
      li.textContent = `${a.nome} — ${a.estrelas}★ — ${a.comentario ?? ""}`;
      lista.appendChild(li);
    };

    socket.onmessage = e => {
      const d = JSON.parse(e.data);
      if (Array.isArray(d)) d.forEach(mostrar);   // lista inicial
      else if (d.erro) alert(d.erro);             // erro de validação
      else mostrar(d);                            // nova avaliação
    };

    document.getElementById("enviar").onclick = () => {
      socket.send(JSON.stringify({
        nome: document.getElementById("nome").value,
        estrelas: Number(document.getElementById("estrelas").value),
        comentario: document.getElementById("comentario").value
      }));
    };
</script>
</body>
</html>
